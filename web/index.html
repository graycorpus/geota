<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弦谱 · 吉他扒谱</title>
    <link rel="icon" href="data:,">
  </head>
  <body>
    <main class="workspace">
      <aside class="sidebar">
        <header class="brand">
          <span class="brand-mark" aria-hidden="true">♪</span>
          <span>弦谱</span>
        </header>
        <section class="input-panel" aria-labelledby="upload-heading">
          <h1 id="upload-heading">吉他扒谱</h1>
          <p class="intro">上传一段吉他录音，生成可以阅读的六线谱。</p>
          <form id="upload-form">
            <label class="file-drop" for="audio-file">
              <span class="upload-icon" aria-hidden="true">↑</span>
              <strong id="file-label">选择 MP3 或拖到这里</strong>
              <span class="file-limit">单个文件 · 最多 25 MiB</span>
              <input id="audio-file" name="audio" type="file" accept=".mp3,audio/mpeg">
            </label>
            <label class="generation-mode">生成方式
              <select id="score-mode">
                <option value="accompaniment">简化伴奏谱</option>
                <option value="transcription">原音扒谱</option>
              </select>
            </label>
            <button class="primary" id="generate" type="submit" disabled>生成吉他谱</button>
          </form>
          <div class="feedback">
            <p id="status" role="status"></p>
            <progress id="progress" max="1" aria-label="当前阶段进度" hidden></progress>
            <p id="error" role="alert" hidden></p>
          </div>
          <section class="audio-section" id="guitar-player" aria-labelledby="guitar-heading" hidden>
            <h2 id="guitar-heading">吉他谱试听</h2>
            <div class="guitar-transport">
              <button class="primary" id="guitar-play" type="button">播放吉他谱</button>
              <input id="guitar-seek" type="range" min="0" max="0" step="0.01" value="0" aria-label="吉他谱进度">
              <span id="guitar-position"></span>
            </div>
            <div class="guitar-mixer">
              <label><input id="melody-enabled" type="checkbox" checked> 旋律</label>
              <input id="melody-volume" type="range" min="0" max="100" value="85" aria-label="旋律音量">
              <label><input id="backing-enabled" type="checkbox" checked> 伴奏</label>
              <input id="backing-volume" type="range" min="0" max="100" value="70" aria-label="伴奏音量">
            </div>
            <p id="guitar-status" role="status"></p>
          </section>
          <section class="audio-section" id="audio-section" aria-labelledby="audio-heading" hidden>
            <h2 id="audio-heading">原始录音</h2>
            <audio id="original-audio" controls preload="metadata" aria-label="原始录音"></audio>
            <div class="practice-controls" aria-label="练习设置">
              <label class="practice-speed">播放速度
                <select id="playback-speed">
                  <option value="0.5">0.5×</option>
                  <option value="0.75">0.75×</option>
                  <option value="1" selected>1×</option>
                  <option value="1.25">1.25×</option>
                  <option value="1.5">1.5×</option>
                </select>
              </label>
              <div class="loop-range" id="loop-range" hidden>
                <label>起始小节 <select id="loop-start"></select></label>
                <label>结束小节 <select id="loop-end"></select></label>
                <button class="secondary" id="loop-toggle" type="button" aria-pressed="false">循环练习</button>
              </div>
            </div>
          </section>
        </section>
      </aside>
      <section class="score-pane" aria-labelledby="score-heading">
        <header class="score-toolbar">
          <h2 id="score-heading">六线谱</h2>
          <label class="track-control" for="track-select" hidden>
            音轨 <select id="track-select"></select>
          </label>
          <input id="project-input" type="file" accept=".geota" hidden>
          <button class="secondary" id="project-open" type="button">打开项目</button>
          <button class="primary score-download" id="score-download" type="button" hidden>下载曲谱（.gp）</button>
          <button class="secondary" id="score-print" type="button" hidden>打印 / 保存 PDF</button>
          <button class="secondary" id="project-save" type="button" hidden>保存项目</button>
          <label class="track-control" id="numbered-control" hidden><input type="checkbox" id="show-numbered">显示数字简谱</label>
          <button class="secondary" id="edit-score" type="button" aria-controls="score-editor" aria-expanded="false" hidden>编辑曲谱</button>
          <button class="secondary" id="load-demo" type="button">查看示例谱</button>
        </header>
        <section class="score-editor" id="score-editor" aria-label="编辑曲谱" hidden>
          <p>点击谱上的品位，或用下方选项定位。选择「添加新音符」可以在该拍补音。</p>
          <div class="editor-fields">
            <label>小节 <select id="edit-bar"></select></label>
            <label>声部 <select id="edit-voice"></select></label>
            <label>第几个位置 <select id="edit-beat"></select></label>
            <label>音符 <select id="edit-note"></select></label>
            <label>目标弦 <select id="edit-string"></select></label>
            <label>品位 <input id="edit-fret" type="number" inputmode="numeric" min="0" max="22" step="1" value="0"></label>
          </div>
          <div class="editor-actions">
            <button class="primary" id="edit-apply" type="button">应用修改</button>
            <button class="secondary" id="edit-delete" type="button">删除音符</button>
            <button class="secondary" id="edit-undo" type="button">撤销</button>
            <button class="secondary" id="edit-redo" type="button">重做</button>
          </div>
          <p id="edit-message" role="status"></p>
        </section>
        <fieldset class="score-editor" id="repeat-settings" hidden>
          <legend>反复演唱</legend>
          <div class="editor-fields">
            <label>反复起始小节 <select id="repeat-start"></select></label>
            <label>反复结束小节 <select id="repeat-end"></select></label>
            <label>演唱总次数 <input id="repeat-plays" type="number" min="2" max="8" value="2"></label>
          </div>
          <div class="editor-actions">
            <button class="secondary" id="repeat-apply" type="button">标记反复</button>
            <button class="secondary" id="repeat-remove" type="button" disabled>取消反复</button>
          </div>
          <p id="repeat-status" role="status"></p>
        </fieldset>
        <div class="score-sheet" id="score-sheet">
          <div class="empty" id="empty-state">
            <div class="staff-icon" aria-hidden="true"><span>♪</span></div>
            <p>上传 MP3 后，生成的六线谱会显示在这里。</p>
          </div>
          <div id="score" aria-label="吉他六线谱" hidden></div>
        </div>
      </section>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
